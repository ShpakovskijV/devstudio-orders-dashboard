<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevStudio | Orders API Demo</title><style>body{font-family:system-ui;background:#0b1220;color:#e9efff;margin:0;padding:32px}main{max-width:900px;margin:auto}header{margin-bottom:28px}small{color:#93a4c1}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card,table{background:#172238;border-radius:14px;padding:18px}.value{font-size:30px;font-weight:750;color:#6ee7b7}table{width:100%;border-collapse:collapse;margin-top:22px;overflow:hidden}th,td{text-align:left;padding:13px;border-bottom:1px solid #2b3a55}th{color:#9eb2d4}button{border:0;border-radius:9px;padding:10px 16px;background:#6ee7b7;color:#102017;font-weight:700;cursor:pointer}select{padding:10px;border-radius:9px;margin-right:8px}.toolbar{margin:20px 0}code{color:#8fd5ff}</style><main><header><small>DEVSTUDIO / PORTFOLIO DEMO</small><h1>Orders Automation Dashboard</h1><p>CSV → Python processing → REST API → interactive dashboard</p></header><section class="cards"><div class="card"><small>Orders</small><div class="value" id="count">—</div></div><div class="card"><small>Paid revenue</small><div class="value" id="revenue">—</div></div><div class="card"><small>Endpoint</small><p><code>GET /api/orders</code></p></div></section><div class="toolbar"><label for="status">Status: </label><select id="status"><option value="">All</option><option value="paid">Paid</option><option value="pending">Pending</option></select><button id="refresh">Refresh</button></div><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table><p id="error" role="status"></p></main><script>const status=document.querySelector('#status'),rows=document.querySelector('#rows'),error=document.querySelector('#error');async function load(){error.textContent='';try{const q=status.value?'?status='+encodeURIComponent(status.value):'';const response=await fetch('/api/orders'+q);if(!response.ok)throw Error('API request failed');const data=await response.json();document.querySelector('#count').textContent=data.count;document.querySelector('#revenue').textContent=Number(data.revenue).toFixed(2);rows.replaceChildren();for(const order of data.orders){const tr=document.createElement('tr');for(const value of [order.order_id,order.customer,Number(order.total).toFixed(2),order.status]){const td=document.createElement('td');td.textContent=value;tr.append(td)}rows.append(tr)}}catch(e){error.textContent=e.message}}status.addEventListener('change',load);document.querySelector('#refresh').addEventListener('click',load);load()</script></html>
